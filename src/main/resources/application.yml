spring:
  application:
    name: tenantguard-java

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_TEMPERATURE:0.2}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: W3C
  otlp:
    tracing:
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: TenantGuard Java
    description: Secure Multi-Tenant SaaS demo with JWT, RBAC and PostgreSQL RLS
    version: 0.0.1-SNAPSHOT

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:3600}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
  security:
    rate-limit:
      backend: ${AUTH_RATE_LIMIT_BACKEND:memory}
      fail-open: ${AUTH_RATE_LIMIT_FAIL_OPEN:true}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      login:
        max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
      refresh:
        max-attempts: ${AUTH_REFRESH_MAX_ATTEMPTS:10}
  security-intelligence:
    ai:
      enabled: ${SECURITY_INTELLIGENCE_AI_ENABLED:false}
