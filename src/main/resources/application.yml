spring:
  application:
    name: tenantguard-java

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: TenantGuard Java
    description: Secure Multi-Tenant SaaS demo with JWT, RBAC and PostgreSQL RLS
    version: 0.0.1-SNAPSHOT

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:3600}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
  security:
    rate-limit:
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      login:
        max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
      refresh:
        max-attempts: ${AUTH_REFRESH_MAX_ATTEMPTS:10}
