spring:
  application:
    name: tenantguard-java

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tenantguard}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:89327934}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: TenantGuard Java
    description: Secure Multi-Tenant SaaS demo with JWT, RBAC and PostgreSQL RLS
    version: 0.0.1-SNAPSHOT

app:
  jwt:
    secret: ${JWT_SECRET:tenantguard-demo-secret-key-please-change-2026-very-long}
    expiration-seconds: 3600
