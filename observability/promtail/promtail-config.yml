server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: tenantguard-java
    static_configs:
      - targets:
          - localhost
        labels:
          job: tenantguard-java
          service: tenantguard-java
          __path__: /var/log/tenantguard/*.json
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
