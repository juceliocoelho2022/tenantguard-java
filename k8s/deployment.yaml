apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantguard-app
  labels:
    app: tenantguard-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenantguard-app
  template:
    metadata:
      labels:
        app: tenantguard-app
    spec:
      containers:
        - name: tenantguard-app
          image: tenantguard-java:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tenantguard-config
            - secretRef:
                name: tenantguard-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
