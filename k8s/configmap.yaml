apiVersion: v1
kind: ConfigMap
metadata:
  name: tenantguard-config
data:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:postgresql://CHANGE_ME:5432/tenantguard
  JWT_ACCESS_EXPIRATION_SECONDS: "3600"
  JWT_REFRESH_EXPIRATION_SECONDS: "604800"
  AUTH_RATE_LIMIT_WINDOW_SECONDS: "60"
  AUTH_LOGIN_MAX_ATTEMPTS: "5"
  AUTH_REFRESH_MAX_ATTEMPTS: "10"
  LOG_DIR: /app/logs
  OTEL_SERVICE_NAME: tenantguard-java
