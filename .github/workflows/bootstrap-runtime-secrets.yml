name: Bootstrap Runtime Secrets

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  JWT_SECRET_ID: ${{ vars.JWT_SECRET_ID || 'tenantguard-prod/jwt' }}

jobs:
  bootstrap-jwt:
    name: Initialize JWT Signing Secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-secrets

    steps:
      - name: Validate required variables
        run: |
          test -n "$AWS_REGION" || { echo "AWS_REGION is required"; exit 1; }
          test -n "${{ vars.AWS_RUNTIME_SECRETS_BOOTSTRAP_ROLE_ARN }}" || { echo "AWS_RUNTIME_SECRETS_BOOTSTRAP_ROLE_ARN is required"; exit 1; }

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_SECRETS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize JWT secret if absent
        shell: bash
        run: |
          set -euo pipefail

          if aws secretsmanager get-secret-value --secret-id "$JWT_SECRET_ID" >/dev/null 2>&1; then
            echo "JWT secret already has a value; leaving it unchanged."
            exit 0
          fi

          JWT_SECRET="$(openssl rand -base64 64 | tr -d '\n')"
          aws secretsmanager put-secret-value \
            --secret-id "$JWT_SECRET_ID" \
            --secret-string "$JWT_SECRET" >/dev/null
          unset JWT_SECRET

          echo "JWT signing secret initialized successfully."

      - name: Publish bootstrap summary
        run: |
          echo "### TenantGuard runtime secret bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secret: \`$JWT_SECRET_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Value exposure: none" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terraform state contains signing key: no" >> "$GITHUB_STEP_SUMMARY"
