services:
  postgres:
    image: postgres:17-alpine
    container_name: tenantguard-postgres
    environment:
      POSTGRES_DB: tenantguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 89327934
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenantguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tenantguard_pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: tenantguard-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tenantguard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: tenantguard-demo-secret-key-please-change-2026-very-long
    ports:
      - "8081:8080"

volumes:
  tenantguard_pgdata:
