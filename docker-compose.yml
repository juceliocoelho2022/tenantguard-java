services:
  postgres:
    image: postgres:17-alpine
    container_name: tenantguard-postgres
    environment:
      POSTGRES_DB: tenantguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenantguard}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenantguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tenantguard_pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: tenantguard-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tenantguard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tenantguard}
      JWT_SECRET: ${JWT_SECRET:-tenantguard-demo-secret-key-please-change-2026-very-long}
    ports:
      - "8081:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: tenantguard-prometheus
    depends_on:
      - app
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tenantguard_prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: tenantguard-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-tenantguard}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - tenantguard_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  tenantguard_pgdata:
  tenantguard_prometheus_data:
  tenantguard_grafana_data:
